{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · EXEQ Hub</title>
  <link rel="stylesheet" href="{% static 'hub_v4/css/exeq-ledger.css' %}">
</head>
<body class="hub-v4">
  <div class="login-page">
    <div class="login-card">
      <h1>EXEQ Hub</h1>
      <p class="sub">Contabilidade multi-CNPJ · operação fiscal</p>
      <form method="post" action="{% url 'hub-v4-login' %}">
        {% csrf_token %}
        <div class="field">
          <label for="tenant_slug">Escritório (slug)</label>
          <input id="tenant_slug" name="tenant_slug" required autocomplete="organization" placeholder="exeq-lab">
        </div>
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" required autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input id="password" name="password" type="password" required autocomplete="current-password">
        </div>
        {% if error %}<div class="field-error" role="alert">{{ error }}</div>{% endif %}
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;">Entrar</button>
      </form>
      <p class="sub" style="margin-top:16px;margin-bottom:0;">
        Use o slug e o e-mail fornecidos no onboarding EXEQ.
      </p>
    </div>
  </div>
</body>
</html>
