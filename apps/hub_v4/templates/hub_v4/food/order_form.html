{% extends "hub_v4/base.html" %}

{% block page_actions %}
<a class="btn btn-ghost" href="{% url 'hub-v4-food-orders' %}">Lista</a>
<a class="btn btn-ghost" href="{% url 'hub-v4-food-customers' %}">Clientes</a>
<a class="btn btn-ghost" href="{% url 'hub-v4-food-products' %}">Produtos</a>
{% endblock %}

{% block content %}
{% include "hub_v4/food/_subnav.html" %}
<form method="post" class="card" id="food-order-form">
  {% csrf_token %}
  <input type="hidden" name="idempotency_key" value="{{ form.idempotency_key|default:idempotency_key }}" />
  <div class="form-grid">
    <label class="full">
      <span>Cliente</span>
      <select name="customer_id" required>
        <option value="">Selecione…</option>
        <option value="__new__">+ Novo cliente (campos abaixo)</option>
        {% for c in customers %}
        <option value="{{ c.id }}" {% if form.customer_id == c.id|stringformat:"s" %}selected{% endif %}>{{ c.name }} — {{ c.phone_e164|default:c.document }}</option>
        {% endfor %}
      </select>
    </label>
    <label>
      <span>Novo nome</span>
      <input name="new_customer_name" value="{{ form.new_customer_name }}" placeholder="Maria" />
    </label>
    <label>
      <span>Novo telefone</span>
      <input name="new_customer_phone" value="{{ form.new_customer_phone }}" placeholder="+55119…" />
    </label>
    <label>
      <span>Novo e-mail</span>
      <input name="new_customer_email" type="email" value="{{ form.new_customer_email }}" placeholder="cliente@email.com" />
    </label>
    <label>
      <span>CPF/CNPJ (Pix)</span>
      <input name="new_customer_document" value="{{ form.new_customer_document }}" placeholder="somente dígitos" />
    </label>
    <label>
      <span>Canal</span>
      <select name="channel">
        {% for val, label in channels %}
        <option value="{{ val }}" {% if form.channel == val %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="full">
      <span>Observações</span>
      <textarea name="notes" rows="2">{{ form.notes }}</textarea>
    </label>
  </div>

  <div class="section-label">Itens do pedido</div>
  <table class="data" style="margin-bottom:8px;">
    <thead>
      <tr><th>Produto</th><th style="width:120px;">Qtd</th><th style="width:48px;"></th></tr>
    </thead>
    <tbody id="order-lines-body">
      <tr class="order-line-row">
        <td>
          <select name="line_product_id" required>
            <option value="">Selecione…</option>
            {% for p in products %}
            <option value="{{ p.id }}">{{ p.sku }} — {{ p.name }}</option>
            {% endfor %}
          </select>
        </td>
        <td><input name="line_quantity" value="1" required inputmode="decimal" /></td>
        <td><button type="button" class="btn btn-ghost btn-sm order-line-remove" hidden aria-label="Remover linha">×</button></td>
      </tr>
    </tbody>
  </table>
  <button type="button" class="btn btn-ghost btn-sm" id="order-line-add">+ Adicionar item</button>

  <div class="form-grid" style="margin-top:16px;">
    <label>
      <input type="checkbox" name="await_pix" value="1" {% if form.await_pix != "0" %}checked{% endif %} />
      Aguardar Pix (não confirma pago na hora)
    </label>
    <label>
      <input type="checkbox" name="request_pix" value="1" {% if form.request_pix == "1" %}checked{% endif %} />
      Emitir cobrança/Pix no gateway agora
    </label>
  </div>
  <div style="margin-top:16px;">
    <button class="btn btn-primary" type="submit">Criar pedido</button>
  </div>
</form>

<template id="order-line-template">
  <tr class="order-line-row">
    <td>
      <select name="line_product_id" required>
        <option value="">Selecione…</option>
        {% for p in products %}
        <option value="{{ p.id }}">{{ p.sku }} — {{ p.name }}</option>
        {% endfor %}
      </select>
    </td>
    <td><input name="line_quantity" value="1" required inputmode="decimal" /></td>
    <td><button type="button" class="btn btn-ghost btn-sm order-line-remove" aria-label="Remover linha">×</button></td>
  </tr>
</template>
{% endblock %}

{% block scripts %}
<script>
(function () {
  var body = document.getElementById("order-lines-body");
  var tpl = document.getElementById("order-line-template");
  var addBtn = document.getElementById("order-line-add");
  if (!body || !tpl || !addBtn) return;

  function syncRemoveButtons() {
    var rows = body.querySelectorAll(".order-line-row");
    rows.forEach(function (row, idx) {
      var btn = row.querySelector(".order-line-remove");
      if (btn) btn.hidden = rows.length <= 1;
    });
  }

  addBtn.addEventListener("click", function () {
    body.appendChild(tpl.content.cloneNode(true));
    syncRemoveButtons();
  });

  body.addEventListener("click", function (e) {
    var btn = e.target.closest(".order-line-remove");
    if (!btn) return;
    var row = btn.closest(".order-line-row");
    if (row && body.querySelectorAll(".order-line-row").length > 1) {
      row.remove();
      syncRemoveButtons();
    }
  });

  syncRemoveButtons();
})();
</script>
{% endblock %}
