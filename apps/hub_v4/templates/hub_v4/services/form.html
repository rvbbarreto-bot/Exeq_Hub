{% extends "hub_v4/base.html" %}

{% block page_actions %}
<a class="btn btn-ghost" href="{% url 'hub-v4-services' %}">Voltar</a>
{% endblock %}

{% block content %}
<div class="card" data-nbs-form>
  <form method="post">
    {% csrf_token %}
    <div class="form-grid">
      <div class="field">
        <label for="id_service_code">Código *</label>
        <input class="mono" id="id_service_code" name="service_code" required maxlength="32"
               value="{% if form %}{{ form.service_code }}{% elif obj %}{{ obj.service_code }}{% endif %}"
               placeholder="17.19">
      </div>
      <div class="field">
        <label for="id_lc116_item">LC 116</label>
        <input class="mono" id="id_lc116_item" name="lc116_item" maxlength="16"
               value="{% if form %}{{ form.lc116_item }}{% elif obj %}{{ obj.lc116_item }}{% endif %}"
               placeholder="17.19">
      </div>
      <div class="field full">
        <label for="id_description">Descrição *</label>
        <textarea id="id_description" name="description" rows="4" required>{% if form %}{{ form.description }}{% elif obj %}{{ obj.description }}{% endif %}</textarea>
      </div>
      <div class="field">
        <label for="id_codigo_tributacao_nacional_iss">cTribNac (ISS nacional)</label>
        <input class="mono" id="id_codigo_tributacao_nacional_iss" name="codigo_tributacao_nacional_iss" maxlength="16"
               value="{% if form %}{{ form.codigo_tributacao_nacional_iss }}{% elif obj %}{{ obj.codigo_tributacao_nacional_iss }}{% endif %}"
               placeholder="171901">
      </div>
      <div class="field">
        <label for="id_codigo_nbs">Código NBS</label>
        <input class="mono" id="id_codigo_nbs" name="codigo_nbs" maxlength="9" inputmode="numeric"
               value="{% if form %}{{ form.codigo_nbs }}{% elif obj %}{{ obj.codigo_nbs }}{% endif %}"
               placeholder="115013000" autocomplete="off">
      </div>
      <div class="field full">
        <label for="id_nbs_search">Buscar NBS (catálogo)</label>
        <input id="id_nbs_search" type="search" placeholder="Código ou descrição NBS" autocomplete="off">
        <div id="nbs-search-results" class="nbs-search-results" hidden></div>
      </div>
      <div class="field">
        <label for="id_is_active">Ativo</label>
        <select id="id_is_active" name="is_active">
          <option value="1" {% if not obj or obj.is_active %}selected{% endif %}>Sim</option>
          <option value="0" {% if obj and not obj.is_active %}selected{% endif %}>Não</option>
        </select>
      </div>
    </div>
    <div class="wizard-nav" style="margin-top:20px;">
      <a class="btn btn-ghost" href="{% url 'hub-v4-services' %}">Cancelar</a>
      <button type="submit" class="btn btn-primary">Salvar serviço</button>
    </div>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script>
(function () {
  var searchInput = document.getElementById("id_nbs_search");
  var codeInput = document.getElementById("id_codigo_nbs");
  var box = document.getElementById("nbs-search-results");
  if (!searchInput || !box || !codeInput) return;
  var timer = null;
  function csrf() {
    var m = document.cookie.match(/csrftoken=([^;]+)/);
    return m ? m[1] : "";
  }
  function render(items) {
    box.innerHTML = "";
    if (!items.length) {
      box.hidden = true;
      return;
    }
    items.forEach(function (row) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "nbs-search-item";
      btn.textContent = (row.display || row.codigo) + " — " + row.description;
      btn.addEventListener("click", function () {
        codeInput.value = row.codigo || "";
        box.hidden = true;
        searchInput.value = row.description || "";
      });
      box.appendChild(btn);
    });
    box.hidden = false;
  }
  function fetchNbs(q) {
    fetch("/hub/nbs/search/?q=" + encodeURIComponent(q) + "&limit=15", {
      headers: { Accept: "application/json", "X-CSRFToken": csrf() },
      credentials: "same-origin",
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data && data.ok) render(data.results || []);
      })
      .catch(function () { box.hidden = true; });
  }
  searchInput.addEventListener("input", function () {
    clearTimeout(timer);
    var q = (searchInput.value || "").trim();
    if (q.length < 2) {
      box.hidden = true;
      return;
    }
    timer = setTimeout(function () { fetchNbs(q); }, 280);
  });
})();
</script>
{% endblock %}
